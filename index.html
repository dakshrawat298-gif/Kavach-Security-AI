<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavach.ai - Sovereign Security</title>
    <!-- Tailwind CSS for ultra-fast premium styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0a0a0a] text-white h-screen flex flex-col items-center justify-center font-sans overflow-hidden selection:bg-blue-500">
    
    <!-- Background Ambient Glow -->
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[120px] pointer-events-none z-0"></div>

    <!-- Main Glassmorphism Interface -->
    <div class="relative z-10 w-full max-w-sm p-8 rounded-[40px] backdrop-blur-2xl bg-white/[0.03] border border-white/10 shadow-[0_0_50px_rgba(0,100,255,0.05)] flex flex-col items-center">
        
        <!-- Header -->
        <h1 class="text-4xl font-semibold tracking-tighter mb-1">Kavach<span class="text-blue-500">.ai</span></h1>
        <div class="flex items-center gap-2 mb-12">
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            <p class="text-gray-400 text-xs uppercase tracking-widest">DPDP Compliant</p>
        </div>

        <!-- The Big Scan Button -->
        <button id="scanBtn" class="relative group w-48 h-48 rounded-full flex items-center justify-center transition-all duration-500 hover:scale-105 active:scale-95 cursor-pointer outline-none">
            <!-- Ripple Effect -->
            <div class="absolute inset-0 rounded-full bg-blue-500 opacity-20 group-hover:opacity-40 animate-ping"></div>
            <!-- Core Button -->
            <div class="absolute inset-3 rounded-full bg-gradient-to-b from-blue-500 to-blue-800 shadow-[0_0_40px_rgba(0,120,255,0.6)] border border-blue-400/50"></div>
            <span class="relative z-10 text-xl font-medium tracking-wider drop-shadow-lg">SCAN</span>
        </button>

        <!-- Dynamic Status Text -->
        <p id="statusText" class="mt-10 text-gray-400 text-sm h-5 transition-all duration-300">System idle. Tap to secure.</p>
    </div>

    <!-- Footer -->
    <div class="absolute bottom-6 text-gray-600 text-xs flex items-center gap-2">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L3 7l0 6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12l0-6-9-5zM12 11.99l7-2.76c-.4 4.39-3.23 8.35-7 9.7-3.77-1.35-6.6-5.31-7-9.7l7 2.76z"/></svg>
        Bharat Sovereign Infrastructure
    </div>

    <script src="app.js"></script>
</body>
</html>
